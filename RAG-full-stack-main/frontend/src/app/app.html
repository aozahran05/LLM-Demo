<div class="chat-container">

  <header class="chat-header">
    <h1>InvoiceQ AI</h1>
    <p>Ask anything about your invoices</p>
  </header>

  <main class="chat-messages" #messagesContainer>
 
    @for (msg of messages(); track $index) {
      <div
        class="message"
        [class.user-message]="msg.sender === 'user'"
        [class.bot-message]="msg.sender === 'bot'">

        {{ msg.text }}

      </div>
    }

    @if (isLoading()) {
      <div class="message bot-message typing-indicator">
        Thinking...
      </div>
    }

  </main>

  <footer class="chat-input">

    <input
      type="text"
      placeholder="Ask about your invoices..."
      [ngModel]="message()"
      (ngModelChange)="message.set($event)"
      (keydown.enter)="$event.preventDefault(); sendMessage()"
      [disabled]="isLoading()"
    />

    <button (click)="sendMessage()" [disabled]="isLoading() || !message().trim()">
      Send
    </button>

  </footer>

</div>
