spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invoiceq}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:supersecretkeymustbeatleast256bitslongforhmacsha256algorithm123456}
jwt.expiration=86400000

ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.default-company-name=${AI_DEFAULT_COMPANY_NAME:ACME}